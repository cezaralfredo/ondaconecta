name: Deploy to Cloudflare Workers Static Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependências
        run: npm install --legacy-peer-deps

      - name: 🛡️ Auditoria SEO Pré-Build (Links, Anti-Canibalização & E-E-A-T)
        run: npm run seo:audit

      - name: 🏗️ Gerar Build estático do Astro
        run: npm run build

      - name: 🔍 Auditoria SEO Pós-Build (Home Bloat, FAQPage & Sitemap)
        run: npm run seo:audit:dist

      - name: 🚀 Deploy atômico no Cloudflare Workers Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 43cc48c6912f96cf45bf4177dcbe31ce
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN não configurado no GitHub. Configure-o em Settings -> Secrets -> Actions para deploy automático."
            exit 0
          fi
          npx cf deploy ./dist --force

      - name: ⚡ Notificar motores de busca via IndexNow (Bing / Yandex)
        run: node scripts/submit-indexnow.mjs

      - name: 📢 Publicar novidade no canal do Telegram (se configurado)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@ondaconecta' }}
        run: node scripts/telegram-publisher.mjs --latest

      - name: ✅ Notificar Sucesso Operacional no Telegram (se configurado)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-status.mjs --success

      - name: 🚨 Notificar Falha ou Erro de Build/SEO no Telegram (Circuit Breaker)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-status.mjs --error "Falha na pipeline GitHub Actions (Deploy Cloudflare / Auditoria SEO). Verifique a aba Actions do repositório."
