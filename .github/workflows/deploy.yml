name: Deploy via FTP to DirectAdmin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependências
        run: npm install --legacy-peer-deps

      - name: 🛡️ Auditoria SEO Pré-Build (Links, Anti-Canibalização & E-E-A-T)
        run: npm run seo:audit

      - name: 🏗️ Gerar Build estático do Astro
        run: npm run build

      - name: 🔍 Auditoria SEO Pós-Build (Home Bloat, FAQPage & Sitemap)
        run: npm run seo:audit:dist

      - name: 🚀 Sincronizar via FTP com public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: pro127.dnspro.net.br
          username: ${{ secrets.FTP_USERNAME || 'ondaconecta' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
          timeout: 60000
          security: 'loose'
          log-level: 'verbose'

      - name: ⚡ Notificar motores de busca via IndexNow (Bing / Yandex)
        run: node scripts/submit-indexnow.mjs

      - name: 📢 Publicar novidade no canal do Telegram (se configurado)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@ondaconecta' }}
        run: node scripts/telegram-publisher.mjs --latest

      - name: ✅ Notificar Sucesso Operacional no Telegram (se configurado)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-status.mjs --success

      - name: 🚨 Notificar Falha ou Erro de Build/SEO no Telegram (Circuit Breaker)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-status.mjs --error "Falha na pipeline GitHub Actions (Deploy via FTP / Auditoria SEO). Verifique a aba Actions do repositório."

