name: Weekly Live SEO Healthcheck

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  seo-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🩺 Verificar saúde SEO ao vivo em produção
        run: node scripts/live-seo-healthcheck.mjs
