name: Weekly Live SEO Healthcheck

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  seo-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🩺 Verificar saúde SEO ao vivo em produção
        run: node scripts/live-seo-healthcheck.mjs

      - name: ✅ Notificar Saúde SEO OK no Telegram (se configurado)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-status.mjs --healthcheck-ok

      - name: 🚨 Alerta Imediato de Queda ou Regressão SEO em Produção
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-status.mjs --error "Alerta crítico: O monitor live-seo-healthcheck.mjs detectou uma falha nas rotas ou no SEO ao vivo em https://ondaconecta.com.br."
